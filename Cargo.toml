[package]
name = "note_vault"
version = "0.1.0"
edition = "2024"

[dependencies]
# Serialisierung
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Kryptographie (Pure Rust Implementierungen)
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["std"] }

# Speicher-Sicherheit und Hilfstools
zeroize = { version = "1.6", features = ["zeroize_derive"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
rpassword = "7.5.4"
slint = "1.17.1"
walkdir = "2.5.0"
rayon = "1.12.0"
rfd = "0.17.2"
global-hotkey = "0.8.0"
tray-icon = "0.25.1"
arboard = "3.6.1"
resvg = "0.47.0"
aes-gcm = "0.11.1"
blake3 = "1.8.7"

[build-dependencies]
slint-build = "1.17.1"
winres = "0.1"

[[bin]]
name = "note_vault_cli"
path = "src/cli.rs"

[[bin]]
name = "note_vault"
path = "src/main.rs"
